<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Calm screen-time wellbeing for families" />
    <title>SenseHeaven</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('sh-theme') || 'system';
          var dark = pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themePref = pref;
        } catch (e) {}
      })();
    </script>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0C0E14" media="(prefers-color-scheme: dark)">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
