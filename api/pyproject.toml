[project]
name = "senseheaven-api"
version = "1.0.0"
description = "SenseHeaven parent API + device API (FastAPI + PostgreSQL)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
addopts = "-q --cov=api.app --cov-report=term-missing"

[tool.coverage.run]
source = ["api/app"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: FastAPI's Depends/Query-in-default idiom is the framework pattern.
extend-ignore = ["B008"]
